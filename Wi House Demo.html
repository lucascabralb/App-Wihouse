  --t1:rgba(255,255,255,.97);--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.36);
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:74px;--r:20px;--r-sm:14px;--r-lg:28px;--ease:cubic-bezier(.22,1,.36,1);--blur:blur(28px) saturate(180%);
  --mc:#5aa9ff;--mc2:#2f6fd6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor}
#app{position:relative;width:100%;height:100%;max-width:1100px;margin:0 auto;overflow:hidden}
#pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--safe-top) 0 calc(var(--nav-h) + var(--safe-bot) + 34px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#pg::-webkit-scrollbar{display:none}
.enter{animation:enter .42s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* marca */
.brand-top{position:absolute;z-index:60;top:calc(var(--safe-top) + 18px);right:16px;padding:6px;border-radius:17px;background:rgba(14,14,17,.55);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border-soft);box-shadow:0 8px 22px -10px rgba(0,0,0,.6);pointer-events:none}
.logo{display:flex;align-items:center;gap:9px}
.logo img{display:block;height:30px;width:auto}
.lg-ic{width:30px;height:30px;border-radius:8px;background:#141416;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.5px}
.lg-tx{display:flex;flex-direction:column;line-height:1}
.lg-tx b{font-size:17px;font-weight:800;letter-spacing:-.4px}
.lg-tx small{font-size:6.5px;font-weight:700;letter-spacing:1.6px;color:var(--t2);margin-top:3px;text-transform:uppercase}
.brand-foot{display:flex;justify-content:center;padding:40px 0 6px;opacity:.55;pointer-events:none}
.logo-ic{display:block;width:44px;height:auto;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.logo-full{display:block;width:120px;height:auto}
.brand-foot .logo-full{width:110px}
.prof-in .logo-full{width:130px;margin-bottom:6px}
@media (min-width:700px){.logo-ic{width:52px;border-radius:13px}}

/* nav flutuante */
#nav{position:absolute;left:16px;right:16px;bottom:calc(var(--safe-bot) + 14px);max-width:620px;margin:0 auto;height:var(--nav-h);background:rgba(14,14,17,.66);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:26px;display:flex;align-items:center;justify-content:space-around;z-index:100;box-shadow:0 20px 50px -12px rgba(0,0,0,.7)}
.ni{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--t3)}
.ni svg.i{width:22px;height:22px;stroke-width:1.6;transition:color .25s}
.ni span{font-size:10px;font-weight:700;letter-spacing:.2px}
.ni.on{color:var(--accent)}.ni.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
.ni:active{opacity:.6}

/* topo de página */
.ph{padding:26px 22px 14px;padding-right:150px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.ph p{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 6px}
.pill{height:42px;padding:0 16px;border-radius:21px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--t1);background:var(--glass);border:1px solid var(--border-soft);white-space:nowrap;transition:transform .18s var(--ease),background .2s}
.pill:active{transform:scale(.95);background:var(--glass-3)}
.pill svg.i{width:17px;height:17px}
.sl{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--t3);text-transform:uppercase;padding:0 22px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sl button{font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:700;min-height:36px}

/* superfícies */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 36px -18px rgba(0,0,0,.65)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--glass-2);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .3s var(--ease),box-shadow .3s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#e2e2e2);box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s var(--ease),background .3s}
.tog.on{background:linear-gradient(135deg,#fff,#d4d4d8);border-color:transparent;box-shadow:var(--accent-glow)}
.tog.on::after{transform:translateX(20px);background:#0d0d0f}
.lg{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
.lr{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--border-soft)}
.lr:last-child{border-bottom:none}
.li{width:42px;height:42px;border-radius:13px;background:var(--glass-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t2);transition:all .25s var(--ease)}
.li:active{transform:scale(.92)}
.li.on{background:var(--accent-dim);border-color:var(--accent-border);box-shadow:0 0 16px rgba(255,255,255,.14);color:#fff}
.lc{flex:1}.lt{font-size:15.5px;font-weight:700;letter-spacing:-.1px}
.ls{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 10px rgba(74,222,128,.8);display:inline-block;flex-shrink:0}
.dot.off{background:#55565c;box-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;--p:0%;touch-action:pan-y;display:block}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(255,255,255,.1) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.6)}

/* início */
.hero{position:relative;height:380px;overflow:hidden;background:radial-gradient(140% 100% at 20% -10%,#1d1e22 0%,#0d0d10 55%,#050506 100%);padding:28px 22px 22px;display:flex;flex-direction:column}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.08),transparent 45%),radial-gradient(circle at 85% 0%,rgba(255,255,255,.05),transparent 40%)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--bg) 100%)}
.hero>*{position:relative;z-index:1}
.greet{font-size:17px;font-weight:700;color:var(--t2)}
.hname{font-size:46px;font-weight:800;letter-spacing:-1.4px;line-height:1.08;max-width:calc(100% - 150px)}
.sig{width:30px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,#9a9aa0);margin-top:12px;box-shadow:0 0 8px rgba(255,255,255,.4)}
.clock{font-size:96px;font-weight:300;letter-spacing:-4px;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.wx{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:var(--glass);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--t2)}
.wx svg.i{width:15px;height:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 20px}
.stat{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--border-soft);text-align:left;transition:transform .2s var(--ease)}
.stat:active{transform:scale(.97)}
.stat svg.i{color:var(--t2)}
.stat span{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--t3);text-transform:uppercase;flex:1}
.stat b{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 22px 14px;scrollbar-width:none;touch-action:pan-x pan-y}
.car::-webkit-scrollbar{display:none}
.car .rt{flex:0 0 31%;height:220px;scroll-snap-align:center;transition:transform .2s ease-out,opacity .2s ease-out}

/* cartão de ambiente com foto */
.rt{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;border:1px solid var(--border-soft);cursor:pointer;display:block;width:100%;text-align:left}
.rt:active{transform:scale(.97)}
.rt .ph-img,.rdh .ph-img{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .5s var(--ease),transform 6s var(--ease)}
.rt .warm,.rdh .warm{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 20%,rgba(255,190,120,.35),transparent 70%);mix-blend-mode:soft-light;transition:opacity .5s;pointer-events:none}
.rt::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,transparent 30%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.92) 100%);pointer-events:none}
.rt-in{position:absolute;left:18px;right:18px;bottom:15px;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.rt-in b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.rt-in small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);margin-top:3px}
.rt-pw{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,12,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);color:#fff;transition:background .25s}
.rt-pw.on{background:#fff;color:#0b0b0c;box-shadow:0 0 22px rgba(255,255,255,.45)}
.gl{padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.gl .rt{height:150px}

/* cenas */
.sc{background:var(--glass);border:1px solid var(--border-soft);border-radius:var(--r-lg);display:flex;align-items:center;gap:16px;padding:17px 19px;text-align:left;transition:all .25s var(--ease);width:100%}
.sc:active{transform:scale(.98)}
.sc.on{border-color:var(--accent-border);background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.si{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--glass-2),var(--glass));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:rgba(255,255,255,.88)}
.si svg.i{width:23px;height:23px}
.sc.on .si{background:#fff;color:#0b0b0c;border-color:transparent}
.st{font-size:16px;font-weight:800;letter-spacing:-.2px}.sb{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.spb{width:38px;height:38px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.spb svg.i{width:12px;height:12px}

/* ambiente */
.rdh{position:relative;height:300px;overflow:hidden;background:#000}
.rdh::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,rgba(0,0,0,.4) 62%,var(--bg) 100%);pointer-events:none}
.back{position:absolute;z-index:3;top:calc(var(--safe-top) + 20px);left:20px;display:flex;align-items:center;gap:2px;font-size:15px;font-weight:700;background:rgba(14,14,17,.45);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);padding:9px 15px 9px 10px;border-radius:20px}
.back svg.i{width:18px;height:18px;stroke-width:2.4}
.rdh-in{position:absolute;z-index:2;left:22px;right:22px;bottom:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rdh-in h1{font-size:34px;font-weight:800;letter-spacing:-1px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.rdh-in p{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:rgba(255,255,255,.82);margin-top:4px}
.nxt{display:flex;gap:8px}
.nxt button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(14,14,17,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border-soft)}
.all{margin:-8px 20px 0;position:relative;z-index:4}
.rd-body{padding:0 20px;column-count:1;column-gap:14px}
.blk{break-inside:avoid;-webkit-column-break-inside:avoid;padding:22px 0 4px}
.blk .sl{padding:0 2px;margin-top:0}

/* cortinas */
.shc{padding:16px 18px 14px}
.shc+.shc{margin-top:12px}
.shc input[type=range]{margin-top:10px}
.shh{display:flex;align-items:center;gap:14px}
.win{position:relative;height:118px;border-radius:14px;overflow:hidden;margin:14px 0 12px;background:linear-gradient(#5f8fbf,#c7dbe8 58%,#7d9c66 58%,#4b6e3c);border:3px solid #1d1d21;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.win::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 1.5px),#1d1d21 calc(50% - 1.5px),#1d1d21 calc(50% + 1.5px),transparent calc(50% + 1.5px));z-index:1}
.win::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;background:#2c2c31;z-index:3}
.pl{position:absolute;top:0;bottom:0;z-index:2;background:repeating-linear-gradient(90deg,#d6cdbd 0 7px,#bcb19d 7px 13px);box-shadow:0 0 14px rgba(0,0,0,.4);transition:width 60ms linear,height 60ms linear}
.pl.l{left:0}.pl.r{right:0}
.win.vo .pl{background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 7px,rgba(255,255,255,.42) 7px 13px);box-shadow:none}
.win.p .pl{left:0;right:0;bottom:auto;background:repeating-linear-gradient(180deg,#e2ddd3 0 8px,#aea697 8px 10px)}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb{height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;background:var(--glass-2);border:1px solid var(--border);transition:transform .18s var(--ease),background .2s}
.pb:active{transform:scale(.95);background:var(--glass-3)}
.pb.on{background:linear-gradient(145deg,#fff,#d6d6da);color:#0b0b0c;border-color:transparent;box-shadow:var(--accent-glow)}
.pb svg.i{width:18px;height:18px}

/* mídia */
.mc{padding:16px 18px 18px}
.mch{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pwb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--border);color:var(--t2);margin-left:auto;transition:all .25s}
.pwb.on{background:#fff;color:#0b0b0c;border-color:transparent;box-shadow:var(--accent-glow)}
.screen{position:relative;aspect-ratio:16/9;border-radius:16px;border:5px solid #18181b;background:#030304;overflow:hidden;display:flex;align-items:flex-end;padding:16px}
.screen.on{background:radial-gradient(80% 95% at 72% 18%,var(--c0),transparent 70%),linear-gradient(160deg,var(--c1),#000)}
.screen p{margin:auto;color:#4c4c52;font-weight:600;font-size:13px}
.screen small{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7)}.screen b{display:block;font-size:20px;font-weight:800}
.screen span{font-size:12.5px;color:rgba(255,255,255,.7)}
.np{display:grid;grid-template-columns:108px minmax(0,1fr);gap:16px;align-items:center}
.np.sm{grid-template-columns:70px minmax(0,1fr);gap:14px}
.np small{font-size:11.5px;font-weight:700;color:var(--t2);letter-spacing:.3px}.np b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px;margin:2px 0}.np span{font-size:13px;color:var(--t2);font-weight:500}
.np.sm b{font-size:15.5px}
.art{position:relative;aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 30% 25%,var(--c0),var(--c1) 78%);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.art::before{content:'';position:absolute;inset:20%;border-radius:50%;border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 12px rgba(255,255,255,.05),0 0 0 26px rgba(255,255,255,.03)}
.art.off{filter:grayscale(1) brightness(.45)}
.eq{position:absolute;left:10px;bottom:10px;display:none;gap:3px;align-items:flex-end;height:20px}
.art.pl .eq{display:flex}
.eq i{width:4px;height:6px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:5px}50%{height:20px}}
.prog{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:#fff;transition:width 1s linear}
.tm{display:flex;justify-content:space-between;color:var(--t3);font-size:11.5px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0 10px}
.cb{width:52px;height:52px;border-radius:50%;background:var(--glass-2);border:1px solid var(--border);display:grid;place-items:center;transition:transform .15s var(--ease)}
.cb:active{transform:scale(.9)}
.cb.big{width:66px;height:66px;background:#fff;color:#0b0b0c;border:0;box-shadow:var(--accent-glow)}
.cb.s{width:44px;height:44px}.cb.s.big{width:52px;height:52px}
.volr{display:flex;align-items:center;gap:12px;color:var(--t2)}
.volr span{width:28px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.dim{opacity:.35;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{height:38px;padding:0 15px;border-radius:19px;display:flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--t2);background:var(--glass);border:1px solid var(--border-soft);transition:all .2s}
.chip.on{background:#fff;color:#0b0b0c;border-color:transparent}
.dpad{position:relative;width:220px;height:220px;margin:20px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.10),rgba(255,255,255,.02) 66%),var(--glass);border:1px solid var(--border);box-shadow:inset 0 0 36px rgba(0,0,0,.45),0 22px 44px -22px rgba(0,0,0,.8)}
.dp{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s var(--ease)}
.dp svg.i{width:24px;height:24px;stroke-width:2.3;opacity:.8}
.dp:active{background:var(--accent-dim);transform:scale(.9)}
.dp.u{top:6px;left:50%;margin-left:-33px}.dp.d{bottom:6px;left:50%;margin-left:-33px}.dp.l{left:6px;top:50%;margin-top:-33px}.dp.r{right:6px;top:50%;margin-top:-33px}

case 'sicon':newSc.icon=d.v;reSheet('scene');return;
case 'dst':newSc.acts[d.k]=newSc.acts[d.k]==d.v?undefined:d.v;reSheet('scene');return;
case 'sfav':newSc.fav=!newSc.fav;reSheet('scene');return;
case 'savescene':{const name=$('#hx-sname').value.trim().replace(/[<>&"']/g,''),acts=Object.keys(newSc.acts).filter(k=>newSc.acts[k]).map(k=>({k,v:newSc.acts[k]}));
 if(!name)return err('Digite o nome da cena.');if(!acts.length)return err('Escolha ao menos um dispositivo (Ligar ou Desligar).');
 SC.push({id:'c'+(SC.length+1)+'_'+Date.now(),n:name,d:acts.length+' dispositivo(s)',i:newSc.icon,fav:newSc.fav,local:true,acts});persist();closeSheet();render(1);toast(ic('bolt'),`Cena "${name}" criada`);return}
case 'delscene':{const k=SC.findIndex(x=>x.id==d.s);if(k>-1)SC.splice(k,1);persist();SH.scene();render(1);toast(ic('bolt'),'Cena excluída');return}
case 'photopick':picking=d.r;fileIn.click();return;
case 'photoreset':r.img=PHOTOS[r.id];SH.photos();render(1);toast(ic('cam'),'Foto original restaurada');return;
case 'savewx':{const c=$('#hx-city').value.trim().replace(/[<>&"']/g,''),u=$('#hx-uf').value.trim().toUpperCase().replace(/[^A-Z]/g,'');if(c.length<2)return err('Digite o nome da cidade');
 WX={city:c,uf:u,temp:24+Math.floor(Math.random()*7),desc:['Céu limpo','Poucas nuvens','Parcialmente nublado'][Math.floor(Math.random()*3)]};persist();closeSheet();render(1);toast(ic('pin'),'Local salvo');return}
case 'delwx':WX={city:'',uf:''};persist();closeSheet();render(1);toast(ic('pin'),'Clima removido da tela inicial');return;
case 'switchuser':CUR=null;persist();S.v='home';render(0);return;
case 'pickuser':{const u=USERS.find(x=>x.id==d.id);prof(u.id);return}
case 'pincancel':$('#prof').classList.remove('open');CUR=null;prof();return;
case 'pinok':{const u=USERS.find(x=>x.id==d.id);if($('#pinInput').value!==u.pin){$('#pinErr').textContent='PIN incorreto';$('#pinInput').value='';return}CUR=u;persist();$('#prof').classList.remove('open');S.v='home';render(0,1);toast(ic('user'),`Olá, ${u.name}`);return}
}
keepCar(()=>render(1))};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName=='A')return;e.preventDefault();act(el.dataset.a,el.dataset)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pinInput'){const b=$('[data-a=pinok]');if(b)act('pinok',b.dataset);return}if((e.key=='Enter'||e.key==' ')&&e.target.matches('.rt')){e.preventDefault();act('go',e.target.dataset)}if(e.key=='Escape')closeSheet()});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;const r=RM[el.dataset.r],v=+el.value;el.style.setProperty('--p',v+'%');
if(k=='lv'){const i=+el.dataset.i,l=r.L[i];l.v=v;if(v>0)l.last=v;const row=$('#lr-'+i);row.querySelector('.li').classList.toggle('on',v>0);row.querySelector('.tog').classList.toggle('on',v>0);$('#ls-'+i).textContent=lst(l);$('#lc').textContent=`${lit(r)} de ${r.L.length}`;updPhoto(r)}
else if(k=='sp'){const i=+el.dataset.i,s=r.S[i];s.tg=null;s.pos=v;updShade(r,i)}
else if(k=='vol'){r.av.vol=v;const t=$('#vv-'+r.id);if(t)t.textContent=v}});
/* mostrador do ar: arrastar */
let drag=null;
const dialAt=(el,x,y)=>{const b=el.getBoundingClientRect();let deg=Math.atan2(y-(b.top+b.height/2),x-(b.left+b.width/2))*180/Math.PI;let a=(deg-135+720)%360;if(a>270)a=a>315?0:270;return Math.round(16+a/270*14)};
const dialSet=(id,t)=>{const r=RM[id];if(r.ac.set===t&&r.ac.on)return;r.ac.set=t;r.ac.on=true;const c=$('#ac-'+id);if(!c)return;c.classList.add('on');$('#dl-'+id).innerHTML=dialSvg(r)};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-dial]');if(!el)return;drag=el.dataset.dial;e.preventDefault();dialSet(drag,dialAt(el,e.clientX,e.clientY))});
document.addEventListener('pointermove',e=>{if(!drag)return;const el=$('#dl-'+drag);if(el)dialSet(drag,dialAt(el,e.clientX,e.clientY))});
const endDrag=()=>{if(!drag)return;drag=null;render(1)};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* motores das cortinas */
setInterval(()=>R.forEach(r=>r.S.forEach((s,i)=>{if(s.tg==null)return;const d=s.tg-s.pos;if(Math.abs(d)<=1.2){s.pos=s.tg;s.tg=null}else s.pos+=Math.sign(d)*1.2;updShade(r,i)})),60);
/* mídia */
setInterval(()=>{let ch=0;R.forEach(r=>{const a=r.av;if(!a||!a.on||!a.play)return;a.p++;if(a.p>=item(r)[2]){a.t=(a.t+1)%list(r).length;a.p=0;ch=1}
const g=$('#pg-'+r.id);if(g){g.style.width=a.p/item(r)[2]*100+'%';$('#pt-'+r.id).textContent=fmt(a.p)}});
if(ch&&!drag&&!(document.activeElement&&document.activeElement.type=='range'))keepCar(()=>render(1))},1000);
/* temperatura ambiente */
setInterval(()=>R.forEach(r=>{const c=r.ac;if(!c)return;const tg=c.on?c.set:27;if(c.cur!=tg){c.cur+=Math.sign(tg-c.cur);const e=$('#ca-'+r.id);if(e)e.textContent=`Ambiente ${c.cur}°`}}),4000);
setInterval(upClock,10000);

render(0,1);
}
</script>
</body>
